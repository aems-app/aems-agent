name: Build AEMS Agent

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (for manual runs)"
        required: false
        default: "dev"

permissions:
  contents: write
  id-token: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      WIN_CODESIGN_CERT_PFX_BASE64: ${{ secrets.WIN_CODESIGN_CERT_PFX_BASE64 }}
      WIN_CODESIGN_CERT_PASSWORD: ${{ secrets.WIN_CODESIGN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev,build]"

      - name: Install NSIS
        run: choco install nsis -y

      - name: Add NSIS to PATH
        run: echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Build with PyInstaller and NSIS installer
        run: python packaging/build.py --platform windows

      - name: Verify installer exists
        run: |
          if (Test-Path "dist\aems-agent-setup.exe") {
            Write-Host "Installer built: dist\aems-agent-setup.exe"
            (Get-Item "dist\aems-agent-setup.exe").Length
          } else {
            Write-Host "::warning::Installer not found. Running NSIS directly..."
            & "C:\Program Files (x86)\NSIS\makensis.exe" /DDIST_DIR=dist\aems-agent /DOUTPUT_DIR=dist packaging\windows\installer.nsi
          }

      - name: Check Windows signing credentials
        id: win_sign_check
        run: |
          if ($env:WIN_CODESIGN_CERT_PFX_BASE64 -and $env:WIN_CODESIGN_CERT_PASSWORD) {
            echo "available=true" >> $env:GITHUB_OUTPUT
            Write-Host "Code signing credentials found, will sign installer."
          } else {
            echo "available=false" >> $env:GITHUB_OUTPUT
            Write-Host "::warning::Code signing credentials not configured. Installer will be unsigned."
          }

      - name: Sign Windows installer (Authenticode)
        if: steps.win_sign_check.outputs.available == 'true'
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WIN_CODESIGN_CERT_PFX_BASE64))
          $signtool = (Get-Command signtool.exe).Source
          & $signtool sign /fd SHA256 /f $pfxPath /p $env:WIN_CODESIGN_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 dist\aems-agent-setup.exe
          & $signtool verify /pa /v dist\aems-agent-setup.exe

      - name: Clean up signing certificate
        if: always()
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          if (Test-Path $pfxPath) { Remove-Item -Force $pfxPath }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aems-agent-windows
          path: |
            dist/aems-agent-setup.exe
            dist/aems-agent/

  build-macos:
    runs-on: macos-latest
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_DEVELOPER_IDENTITY: ${{ secrets.MACOS_DEVELOPER_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev,build]"

      - name: Build .app bundle with PyInstaller (DMG deferred)
        env:
          AEMS_AGENT_SKIP_DMG: "1"
        run: python packaging/build.py --platform macos

      - name: Check macOS signing credentials
        id: mac_sign_check
        run: |
          ALL_PRESENT=true
          for v in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD MACOS_DEVELOPER_IDENTITY APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then
              ALL_PRESENT=false
              break
            fi
          done
          echo "available=$ALL_PRESENT" >> "$GITHUB_OUTPUT"
          if [ "$ALL_PRESENT" = "false" ]; then
            echo "::warning::macOS Developer ID secrets not configured. App will ship ad-hoc signed; macOS users must right-click → Open on first launch."
          else
            echo "Developer ID secrets found, will sign and notarize."
          fi

      - name: Import Developer ID certificate
        if: steps.mac_sign_check.outputs.available == 'true'
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/aems-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          CERT_PATH="$RUNNER_TEMP/developer_id.p12"
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          data = os.environ["MACOS_CERT_P12_BASE64"]
          out = Path(os.environ["RUNNER_TEMP"]) / "developer_id.p12"
          out.write_bytes(base64.b64decode(data))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Sign macOS app bundle (Developer ID)
        if: steps.mac_sign_check.outputs.available == 'true'
        run: |
          codesign --force --deep --options runtime --timestamp --sign "$MACOS_DEVELOPER_IDENTITY" "dist/AEMS Agent.app"
          codesign --verify --deep --strict --verbose=2 "dist/AEMS Agent.app"

      - name: Ad-hoc sign macOS app bundle (no Developer ID)
        if: steps.mac_sign_check.outputs.available == 'false'
        run: |
          # Apple Silicon refuses to launch unsigned binaries at all
          # (kCSRequireSignature). Without a paid Developer ID we still
          # sign ad-hoc — that turns the boot-time "damaged" error into
          # an "unidentified developer" Gatekeeper prompt the user can
          # bypass once via right-click → Open. This is the path most
          # open-source macOS apps (Calibre, Audacity, OBS pre-2020)
          # ship on. The user-facing instructions live in
          # packaging/macos/README.md and on the AEMS settings page.
          #
          # We sign per-binary rather than with `codesign --deep`
          # because PyInstaller's _internal/ subtree contains pip
          # dist-info / egg-info directories that codesign mistakes
          # for malformed nested bundles ("bundle format unrecognized,
          # invalid, or unsuitable"). Walking Mach-O files directly
          # and signing the wrapper last sidesteps that.
          set -euo pipefail
          APP="dist/AEMS Agent.app"
          # PyInstaller already ad-hoc signs the embedded
          # Python.framework and most .so/.dylib files during build. Our
          # job is just to (a) re-sign the loose Mach-O files we still
          # own (those without an existing signature, or those we
          # generated post-build), (b) sign the main executable, and
          # (c) sign the bundle wrapper.
          #
          # Re-signing PyInstaller's already-signed Python.framework
          # fails with "bundle format is ambiguous (could be app or
          # framework)" because the framework's structure (Contents/
          # alongside Versions/) trips codesign's bundle-type detection
          # — there is no reliable way to coerce codesign to accept it
          # as a framework once it sees both layouts. We side-step the
          # whole class of problem by leaving frameworks alone: they
          # already carry a valid ad-hoc signature from PyInstaller.
          #
          # We also have to strip pip's `.dist-info` / `.egg-info`
          # metadata dirs out of the bundle BEFORE signing the wrapper.
          # When codesign processes the .app it walks resources and
          # interprets those dirs as malformed nested bundles
          # ("bundle format unrecognized, invalid, or unsuitable. In
          # subcomponent: .../websockets-16.0.dist-info"). The agent
          # explicitly handles missing dist-info — `_resolve_agent_version`
          # in src/aems_agent/config.py falls back to the bundled
          # `_version.txt` written by build.py — so removing this
          # metadata is safe at runtime.
          echo "Stripping pip metadata directories from bundle..."
          find "$APP" -type d \( -name '*.dist-info' -o -name '*.egg-info' \) \
              -print -prune -exec rm -rf {} +
          # Sign every remaining Mach-O file that is NOT inside a
          # .framework.
          while IFS= read -r -d '' f; do
              if file -b "$f" 2>/dev/null | grep -qE 'Mach-O'; then
                  # `|| true` so a single stubborn file doesn't abort
                  # the whole pass; the final --verify will catch any
                  # gap that matters.
                  codesign --force --sign - --timestamp=none "$f" || true
              fi
          done < <(find "$APP/Contents/MacOS" -type f \
                   ! -path '*/*.framework/*' \
                   -print0)
          # Sign the main executable + the bundle wrapper.
          codesign --force --sign - --timestamp=none "$APP/Contents/MacOS/aems-agent"
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --verbose=2 "$APP"

      - name: Build DMG from signed .app
        run: |
          rm -f "dist/AEMS-Agent.dmg"
          hdiutil create \
            -volname "AEMS Agent" \
            -srcfolder "dist/AEMS Agent.app" \
            -ov "dist/AEMS-Agent.dmg"

      - name: Sign and notarize macOS DMG (Developer ID)
        if: steps.mac_sign_check.outputs.available == 'true'
        run: |
          codesign --force --timestamp --sign "$MACOS_DEVELOPER_IDENTITY" "dist/AEMS-Agent.dmg"
          codesign --verify --verbose=2 "dist/AEMS-Agent.dmg"
          xcrun notarytool submit "dist/AEMS-Agent.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "dist/AEMS-Agent.dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "dist/AEMS-Agent.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aems-agent-macos
          path: |
            dist/AEMS-Agent.dmg
            dist/AEMS Agent.app/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev,build]"

      - name: Build with PyInstaller
        run: python packaging/build.py --platform linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aems-agent-linux
          path: dist/aems-agent-linux-*.tar.gz

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build --sdist --wheel --outdir artifacts/python-dist

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect release assets
        id: assets
        run: |
          ASSETS=""

          if [ -f artifacts/aems-agent-windows/aems-agent-setup.exe ]; then
            ASSETS="$ASSETS artifacts/aems-agent-windows/aems-agent-setup.exe"
          fi
          if [ -f artifacts/aems-agent-macos/AEMS-Agent.dmg ]; then
            ASSETS="$ASSETS artifacts/aems-agent-macos/AEMS-Agent.dmg"
          fi
          linux_tarball=""
          if [ -d artifacts/aems-agent-linux ]; then
            linux_tarball=$(find artifacts/aems-agent-linux -maxdepth 1 -type f -name 'aems-agent-linux-*.tar.gz' | head -n 1)
          fi
          if [ -n "$linux_tarball" ]; then
            ASSETS="$ASSETS $linux_tarball"
          fi
          for f in artifacts/python-dist/*; do
            if [ -f "$f" ]; then
              ASSETS="$ASSETS $f"
            fi
          done

          : > artifacts/sha256sums.txt
          for f in $ASSETS; do
            sha256sum "$f" >> artifacts/sha256sums.txt
          done

          VERSION="${GITHUB_REF#refs/tags/v}"
          cat > artifacts/release-manifest.json <<EOF
          {
            "name": "aems-agent",
            "version": "${VERSION}",
            "generated_at_utc": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "checksum_file": "sha256sums.txt"
          }
          EOF

          ASSETS="$ASSETS artifacts/sha256sums.txt artifacts/release-manifest.json"
          ASSETS=$(echo "$ASSETS" | xargs)
          echo "files=$ASSETS" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign release manifest (keyless)
        run: |
          cosign sign-blob --yes artifacts/release-manifest.json \
            --output-signature artifacts/release-manifest.sig \
            --output-certificate artifacts/release-manifest.pem

      - name: Append signature assets
        id: signed_assets
        run: |
          FILES="${{ steps.assets.outputs.files }} artifacts/release-manifest.sig artifacts/release-manifest.pem"
          FILES=$(echo "$FILES" | xargs)
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_FILES: ${{ steps.signed_assets.outputs.files }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          # shellcheck disable=SC2086
          gh release create "v${VERSION}" \
            --title "AEMS Agent v${VERSION}" \
            --notes "AEMS Local Bridge Agent v${VERSION} - Windows (.exe), macOS (.dmg), Linux (.tar.gz), Python wheel/sdist, plus signed manifest/checksums." \
            ${RELEASE_FILES}
