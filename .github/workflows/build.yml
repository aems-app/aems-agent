name: Build AEMS Agent

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (for manual runs)"
        required: false
        default: "dev"

# Least privilege by default; the release job elevates only what it needs
# (contents: write to create the GitHub release, id-token: write for
# cosign keyless signing). Build jobs run third-party tooling over the
# tree and should not hold a write-capable token.
permissions:
  actions: read
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: aems-agent
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: windows-installer
      WIN_CODESIGN_CERT_PFX_BASE64: ${{ secrets.WIN_CODESIGN_CERT_PFX_BASE64 }}
      WIN_CODESIGN_CERT_PASSWORD: ${{ secrets.WIN_CODESIGN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev,build]"

      - name: Install NSIS
        run: choco install nsis -y

      - name: Add NSIS to PATH
        run: echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Build with PyInstaller and NSIS installer
        run: python packaging/build.py --platform windows

      - name: Verify installer exists
        run: |
          if (Test-Path "dist\aems-agent-setup.exe") {
            Write-Host "Installer built: dist\aems-agent-setup.exe"
            (Get-Item "dist\aems-agent-setup.exe").Length
          } else {
            Write-Host "::warning::Installer not found. Running NSIS directly..."
            & "C:\Program Files (x86)\NSIS\makensis.exe" /DDIST_DIR=dist\aems-agent /DOUTPUT_DIR=dist packaging\windows\installer.nsi
          }

      - name: Resolve Windows signing method
        id: win_sign
        run: |
          if ($env:SIGNPATH_API_TOKEN -and $env:SIGNPATH_ORGANIZATION_ID) {
            "method=signpath" >> $env:GITHUB_OUTPUT
            if ($env:GITHUB_REF -like 'refs/tags/v*') {
              "policy-slug=release-signing" >> $env:GITHUB_OUTPUT
            } else {
              "policy-slug=test-signing" >> $env:GITHUB_OUTPUT
            }
            Write-Host "SignPath configuration found, will sign installer via SignPath."
          } elseif ($env:WIN_CODESIGN_CERT_PFX_BASE64 -and $env:WIN_CODESIGN_CERT_PASSWORD) {
            "method=legacy-pfx" >> $env:GITHUB_OUTPUT
            Write-Host "::warning::Using legacy exportable PFX signing credentials. New public code-signing certificates should use SignPath or another HSM-backed flow instead."
          } else {
            "method=unsigned" >> $env:GITHUB_OUTPUT
            Write-Host "::warning::No Windows signing configuration found. Installer will be unsigned."
          }

      - name: Upload unsigned Windows installer for SignPath
        if: steps.win_sign.outputs.method == 'signpath'
        id: upload_unsigned_windows_installer
        uses: actions/upload-artifact@v4
        with:
          name: aems-agent-windows-unsigned
          path: dist/aems-agent-setup.exe

      - name: Submit Windows signing request (SignPath)
        if: steps.win_sign.outputs.method == 'signpath'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ env.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ steps.win_sign.outputs.policy-slug }}'
          artifact-configuration-slug: '${{ env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}'
          github-artifact-id: '${{ steps.upload_unsigned_windows_installer.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: dist/signpath-signed

      - name: Overlay SignPath-signed installer
        if: steps.win_sign.outputs.method == 'signpath'
        run: |
          $signed = Get-ChildItem -Path dist\signpath-signed -Recurse -Filter aems-agent-setup.exe | Select-Object -First 1
          if (-not $signed) {
            throw "SignPath output did not contain aems-agent-setup.exe"
          }
          Copy-Item $signed.FullName dist\aems-agent-setup.exe -Force

      - name: Sign Windows installer (Authenticode legacy PFX fallback)
        if: steps.win_sign.outputs.method == 'legacy-pfx'
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WIN_CODESIGN_CERT_PFX_BASE64))
          $signtool = (Get-Command signtool.exe).Source
          & $signtool sign /fd SHA256 /f $pfxPath /p $env:WIN_CODESIGN_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 dist\aems-agent-setup.exe
          & $signtool verify /pa /v dist\aems-agent-setup.exe

      - name: Verify Windows installer signature
        if: steps.win_sign.outputs.method != 'unsigned'
        run: |
          $sig = Get-AuthenticodeSignature dist\aems-agent-setup.exe
          if ($sig.Status -ne 'Valid') {
            throw "Authenticode verification failed: $($sig.Status)"
          }
          Write-Host "Signed by: $($sig.SignerCertificate.Subject)"

      - name: Clean up signing certificate
        if: always() && steps.win_sign.outputs.method == 'legacy-pfx'
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          if (Test-Path $pfxPath) { Remove-Item -Force $pfxPath }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aems-agent-windows
          path: |
            dist/aems-agent-setup.exe
            dist/aems-agent/

  build-macos:
    runs-on: macos-latest
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_DEVELOPER_IDENTITY: ${{ secrets.MACOS_DEVELOPER_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev,build]"

      - name: Build .app bundle with PyInstaller (DMG deferred)
        env:
          AEMS_AGENT_SKIP_DMG: "1"
        run: python packaging/build.py --platform macos

      - name: Smoke-test frozen .app (--version)
        # If the frozen launcher can't even print its own version we'd
        # rather find that out before tagging a release. The agent's
        # CLI exits 0 after `--version` so this round-trips fast.
        # LSUIElement=true does not affect direct CLI invocation, and
        # PyInstaller's onedir launcher resolves its bundled libs from
        # Contents/Frameworks/ correctly when run from inside the .app.
        run: |
          set -euo pipefail
          "dist/AEMS Agent.app/Contents/MacOS/aems-agent" --version

      - name: Check macOS signing credentials
        id: mac_sign_check
        run: |
          ALL_PRESENT=true
          for v in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD MACOS_DEVELOPER_IDENTITY APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then
              ALL_PRESENT=false
              break
            fi
          done
          echo "available=$ALL_PRESENT" >> "$GITHUB_OUTPUT"
          if [ "$ALL_PRESENT" = "false" ]; then
              echo "::warning::macOS Developer ID secrets not configured. App will ship ad-hoc signed; on macOS 15 Sequoia users must first double-click it, then use System Settings -> Privacy & Security -> Open Anyway."
          else
            echo "Developer ID secrets found, will sign and notarize."
          fi

      - name: Import Developer ID certificate
        if: steps.mac_sign_check.outputs.available == 'true'
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/aems-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          CERT_PATH="$RUNNER_TEMP/developer_id.p12"
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          data = os.environ["MACOS_CERT_P12_BASE64"]
          out = Path(os.environ["RUNNER_TEMP"]) / "developer_id.p12"
          out.write_bytes(base64.b64decode(data))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Sign macOS app bundle (Developer ID)
        if: steps.mac_sign_check.outputs.available == 'true'
        run: |
          codesign --force --deep --options runtime --timestamp --sign "$MACOS_DEVELOPER_IDENTITY" "dist/AEMS Agent.app"
          codesign --verify --deep --strict --verbose=2 "dist/AEMS Agent.app"

      - name: Verify PyInstaller ad-hoc signing (no Developer ID)
        if: steps.mac_sign_check.outputs.available == 'false'
        run: |
          # Without a paid Apple Developer ID we rely on PyInstaller's
          # built-in ad-hoc signing pass (it signs every collected
          # binary and the BUNDLE-emitted .app wrapper by default on
          # macOS). That turns the boot-time "AEMS Agent is damaged"
          # error into the Gatekeeper warning that users bypass once via
          # the documented first-launch path (on macOS 15 Sequoia:
          # double-click, then System Settings -> Privacy & Security ->
          # Open Anyway; on macOS 11-14: right-click -> Open). This
          # is the shipping model for most open-source Mac apps that
          # don't pay for the Developer Program (Calibre, OBS Studio,
          # MacDown, …).
          #
          # We deliberately do NOT re-sign the bundle here. Apple's
          # TN2206 warns against modifying a signed target after the
          # fact, and the earlier v0.4.11–v0.4.12 attempts to redo
          # the signing in CI repeatedly tripped codesign's flat-bundle
          # detection on PyInstaller's onedir tree. The migration to
          # the `BUNDLE` directive in packaging/aems-agent.spec (paired
          # with pyinstaller>=6.20) puts the executable in
          # Contents/MacOS/, libraries in Contents/Frameworks/, and
          # data in Contents/Resources/ — the layout codesign actually
          # wants.
          set -euo pipefail
          APP="dist/AEMS Agent.app"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Build DMG from signed .app
        run: |
          # Reuse packaging/build.py's staging helper so CI and local
          # macOS builds produce the same DMG root: the signed .app,
          # com.aems.agent.plist, and the /Applications symlink.
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("packaging").resolve()))
          import build

          build.build_macos_dmg(Path("dist/aems-agent"))
          PY

      - name: Verify DMG contents (.app + plist + Applications symlink)
        # Codex review pointed out that build.py used to drop
        # com.aems.agent.plist into dist/ but never staged it into the
        # DMG, so the docs claimed something the release artifact
        # didn't actually contain. build.py now stages the .app, the
        # plist, and a /Applications symlink into a folder that becomes
        # the DMG root. Mount the built DMG read-only and assert all
        # three are present so the gap can't reopen silently.
        run: |
          set -euo pipefail
          mount_dir="$(mktemp -d /tmp/aems-dmg-XXXXXX)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "dist/AEMS-Agent.dmg"
          trap 'hdiutil detach "$mount_dir" -force || true' EXIT
          ls -la "$mount_dir"
          test -d "$mount_dir/AEMS Agent.app" || { echo "::error::AEMS Agent.app missing from DMG"; exit 1; }
          test -f "$mount_dir/com.aems.agent.plist" || { echo "::error::com.aems.agent.plist missing from DMG"; exit 1; }
          test -L "$mount_dir/Applications" || { echo "::error::Applications symlink missing from DMG"; exit 1; }

      - name: Sign and notarize macOS DMG (Developer ID)
        if: steps.mac_sign_check.outputs.available == 'true'
        run: |
          codesign --force --timestamp --sign "$MACOS_DEVELOPER_IDENTITY" "dist/AEMS-Agent.dmg"
          codesign --verify --verbose=2 "dist/AEMS-Agent.dmg"
          xcrun notarytool submit "dist/AEMS-Agent.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "dist/AEMS-Agent.dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "dist/AEMS-Agent.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aems-agent-macos
          path: |
            dist/AEMS-Agent.dmg
            dist/AEMS Agent.app/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev,build]"

      - name: Build with PyInstaller
        run: python packaging/build.py --platform linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aems-agent-linux
          path: dist/aems-agent-linux-*.tar.gz

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build --sdist --wheel --outdir artifacts/python-dist

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect release assets
        id: assets
        run: |
          ASSETS=""

          if [ -f artifacts/aems-agent-windows/aems-agent-setup.exe ]; then
            ASSETS="$ASSETS artifacts/aems-agent-windows/aems-agent-setup.exe"
          fi
          if [ -f artifacts/aems-agent-macos/AEMS-Agent.dmg ]; then
            ASSETS="$ASSETS artifacts/aems-agent-macos/AEMS-Agent.dmg"
          fi
          linux_tarball=""
          if [ -d artifacts/aems-agent-linux ]; then
            linux_tarball=$(find artifacts/aems-agent-linux -maxdepth 1 -type f -name 'aems-agent-linux-*.tar.gz' | head -n 1)
          fi
          if [ -n "$linux_tarball" ]; then
            ASSETS="$ASSETS $linux_tarball"
          fi
          for f in artifacts/python-dist/*; do
            if [ -f "$f" ]; then
              ASSETS="$ASSETS $f"
            fi
          done

          # sha256sums.txt — basename only, never the artifact/ prefix path,
          # so v0.4.24's /self-update parser can read it. v0.4.27+ agents
          # handle both forms, but every release between v0.4.24 and the
          # one users actually run gets bridged once they self-update, so
          # the basename form is the safest cross-version choice.
          : > artifacts/sha256sums.txt
          for f in $ASSETS; do
            sha=$(sha256sum "$f" | awk '{print $1}')
            printf '%s  %s\n' "$sha" "$(basename "$f")" >> artifacts/sha256sums.txt
          done

          VERSION="${GITHUB_REF#refs/tags/v}"
          cat > artifacts/release-manifest.json <<EOF
          {
            "name": "aems-agent",
            "version": "${VERSION}",
            "generated_at_utc": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "checksum_file": "sha256sums.txt"
          }
          EOF

          ASSETS="$ASSETS artifacts/sha256sums.txt artifacts/release-manifest.json"
          ASSETS=$(echo "$ASSETS" | xargs)
          echo "files=$ASSETS" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign release manifest (keyless)
        run: |
          cosign sign-blob --yes artifacts/release-manifest.json \
            --output-signature artifacts/release-manifest.sig \
            --output-certificate artifacts/release-manifest.pem

      - name: Append signature assets
        id: signed_assets
        run: |
          FILES="${{ steps.assets.outputs.files }} artifacts/release-manifest.sig artifacts/release-manifest.pem"
          FILES=$(echo "$FILES" | xargs)
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Create or update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_FILES: ${{ steps.signed_assets.outputs.files }}
        run: |
          # Idempotent release publish. `gh release create` fails with
          # "release already exists" when the tag has been pushed before
          # (real scenario: v0.4.31 was first tagged on the v0.4.30
          # commit, then retagged on the actual v0.4.31 commit — the
          # second run's release step blew up, leaving the release with
          # the wrong binary content. The retag itself is the bug we
          # can't prevent from CI, but failing-shut on the second build
          # is worse than failing-open: with --clobber the second run
          # at least overwrites the wrong assets with the correct ones,
          # matching the intent of the second tag push).
          VERSION="${GITHUB_REF#refs/tags/v}"
          TAG="v${VERSION}"
          NOTES="AEMS Local Bridge Agent ${TAG} - Windows (.exe), macOS (.dmg), Linux (.tar.gz), Python wheel/sdist, plus signed manifest/checksums."

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets with --clobber."
            gh release edit "$TAG" \
              --title "AEMS Agent ${TAG}" \
              --notes "$NOTES"
            # shellcheck disable=SC2086
            gh release upload "$TAG" ${RELEASE_FILES} --clobber
          else
            echo "Release $TAG does not exist; creating it."
            # shellcheck disable=SC2086
            gh release create "$TAG" \
              --title "AEMS Agent ${TAG}" \
              --notes "$NOTES" \
              ${RELEASE_FILES}
          fi
