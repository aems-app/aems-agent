[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aems-agent"
version = "0.4.4"
description = "AEMS Local Bridge Agent — local filesystem access for exam PDFs"
authors = [{name = "AEMS Team", email = "contact@aems.app"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
keywords = ["aems", "grading", "agent", "pdf", "local-bridge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "pynacl>=1.5.0",
    "pillow>=10.0.0",
    "aems-pdf-annotator>=0.2.0,<0.3.0",
    "pymupdf>=1.25.0",
    # pystray is required for the tray notification that surfaces the
    # pairing PIN to the user.  Without it the agent falls back to
    # printing the PIN to stdout, which is invisible to users running
    # the installed agent via Start Menu / autostart.  Small package,
    # cross-platform, no harm including unconditionally.
    "pystray>=0.19.0",
]

[project.urls]
Homepage = "https://aems.app"
Repository = "https://github.com/aems-app/aems-agent"
Issues = "https://github.com/aems-app/aems-agent/issues"
Changelog = "https://github.com/aems-app/aems-agent/blob/main/CHANGELOG.md"

[project.optional-dependencies]
tray = ["pystray>=0.19.0", "pillow>=10.0.0"]
build = ["pyinstaller>=6.0.0,<7.0.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "httpx>=0.25.0",
]

[project.scripts]
aems-agent = "aems_agent.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/aems_agent"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "fastapi",
    "fastapi.*",
    "uvicorn",
    "uvicorn.*",
    "httpx",
    "nacl",
    "nacl.*",
    "pystray",
    "aems_pdf_annotator",
    "aems_pdf_annotator.*",
    "fitz",
    "fitz.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_default_fixture_loop_scope = "function"
addopts = "--basetemp=.pytest-temp"
